[package]
name = "biscuit-swapd"
version = "0.1.0"
edition = "2024"
description = "Biscuit swap helper: XMR/BTC atomic swap maker discovery (prototype)."
license = "GPL-3.0-only"

[[bin]]
name = "biscuit-swapd"
path = "src/main.rs"

[dependencies]
swap = { path = "../swap" }
swap-env = { path = "../swap-env" }
swap-p2p = { path = "../swap-p2p" }

anyhow = { workspace = true }
arti-client = { workspace = true, features = ["static-sqlite", "tokio", "rustls"] }
futures = { workspace = true }
libp2p = { workspace = true, features = ["identify", "macros", "ping", "relay", "rendezvous", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tor-rtcompat = { workspace = true, features = ["tokio"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
